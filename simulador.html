<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Eventos — Balneário Rio Preto</title>
  <meta name="description" content="Simulação e reserva para eventos no Balneário Rio Preto LTDA." />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 1)), url('https://balnearioriopreto.com.br/images/droneview.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e2e8f0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== CSS VARIABLES ===== */
    :root {
      --accent: #10b981; /* Default to WhatsApp Green for CTA */
      --accent-glow: #34d399;
      --card-bg: rgba(15, 23, 42, 0.85); /* Darker glass for contrast against image */
      --card-border: rgba(148, 163, 184, 0.15);
      --input-bg: rgba(30, 41, 59, 0.8);
      --input-border: rgba(148, 163, 184, 0.25);
      --green: #25D366; /* WhatsApp Green specifically */
      --green-glow: #128C7E;
      --radius: 12px;
      --radius-lg: 16px;
    }

    /* ===== PANEL AREA ===== */
    .panel-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    .panel-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .panel-header img {
      width: 120px;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }
    .panel-header h1 {
      font-size: 2rem; font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .panel-header p {
      font-size: 1.1rem; color: #cbd5e1; font-weight: 400; max-width: 600px; margin: 0 auto;
      line-height: 1.5;
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* ===== FORM ELEMENTS ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-grid .full-width { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      background: rgba(30, 41, 59, 0.95);
    }
    .field input::placeholder, .field textarea::placeholder { color: #64748b; }
    .field select option { background: #1e293b; color: #e2e8f0; }
    .field textarea { resize: vertical; min-height: 100px; }

    /* Checkbox */
    .checkbox-row {
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      transition: background 0.2s;
    }
    .checkbox-row:hover { background: rgba(255, 255, 255, 0.05); }
    .checkbox-row input[type="checkbox"] {
      width: 22px; height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 6px;
      margin-top: 2px;
    }
    .checkbox-row span {
      display: flex; flex-direction: column;
    }
    .checkbox-row span strong {
      font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 4px;
    }
    .checkbox-row span small {
      font-size: 0.8rem; color: #94a3b8; line-height: 1.4;
    }

    /* ===== SUMMARY STRIP ===== */
    .summary-strip {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .summary-strip .label-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 16px;
      border-radius: 24px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-glow);
    }
    .summary-strip .calc-detail {
      font-size: 0.9rem; color: #cbd5e1; margin-top: 10px;
    }
    .summary-strip .total-value {
      font-size: 2.2rem; font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .summary-strip .total-label {
      font-size: 0.85rem; color: #94a3b8; text-align: right;
      text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    }

    /* ===== DISCOUNT BANNER ===== */
    .discount-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.25));
      border: 1px dashed rgba(245, 158, 11, 0.5);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 16px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .discount-banner:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.3));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.1);
    }
    .discount-banner .discount-icon {
      font-size: 24px;
      background: rgba(245, 158, 11, 0.2);
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .discount-banner h4 {
      color: #fbbf24;
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .discount-banner p {
      color: #fde68a;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* ===== WHATSAPP BUTTON ===== */
    .btn-whatsapp {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      padding: 20px;
      margin-top: 24px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border: none;
      border-radius: var(--radius-lg);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
      animation: pulse 2s infinite;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 40px rgba(37, 211, 102, 0.5);
      animation: none;
    }
    .btn-whatsapp:active { transform: translateY(0) scale(1); }
    .btn-whatsapp svg { width: 28px; height: 28px; fill: currentColor; }
    .btn-whatsapp:disabled {
      background: #475569;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
      animation: none;
      opacity: 0.7;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    /* ===== PREVIEW DOCUMENT AREA ===== */
    .preview-wrapper {
      margin-top: 40px;
      position: relative;
    }
    
    .preview-overlay-text {
      text-align: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .document-preview {
      background: #ffffff;
      color: #1a1a2e;
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      font-size: 0.9rem;
      user-select: none;
      pointer-events: none; /* Prevents text selection/interaction */
      opacity: 0.95;
    }
    
    /* Document internal styles (scaled down version of index.html) */
    .doc-header { text-align: center; border-bottom: 3px solid #111827; padding-bottom: 24px; margin-bottom: 32px; }
    .doc-header .doc-logo { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 12px; display: block; filter: grayscale(100%); opacity: 0.8; }
    .doc-header h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #111827; }
    .doc-header h2 { font-size: 1rem; font-weight: 500; color: #6b7280; margin-top: 4px; }
    
    .doc-section { margin-bottom: 28px; }
    .doc-section h3 { font-size: 1rem; font-weight: 800; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 6px; margin-bottom: 12px; }
    
    .doc-data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
    .doc-data-grid .data-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #6b7280; margin-bottom: 2px; }
    .doc-data-grid .data-value { font-size: 0.9rem; font-weight: 600; color: #111827; }

    .doc-policy { background: #f8fafc; border-left: 4px solid #111827; padding: 12px 16px; font-size: 0.8rem; line-height: 1.6; color: #374151; text-align: justify; border-radius: 0 6px 6px 0; }
    
    .doc-finance-total { display: flex; justify-content: space-between; align-items: flex-end; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .doc-finance-total .fin-label { font-size: 0.9rem; font-weight: 600; color: #374151; }
    .doc-finance-total .fin-value { font-size: 1.2rem; font-weight: 900; color: #111827; }
    
    .doc-list { list-style-type: disc; padding-left: 20px; }
    .doc-list li { font-size: 0.8rem; color: #4b5563; line-height: 1.8; }
    .doc-list li strong { color: #111827; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full-width { grid-column: auto; }
      .doc-data-grid { grid-template-columns: 1fr; }
      .document-preview { padding: 24px 20px; }
      .panel-wrapper { padding: 24px 12px 40px; }
      .panel-header h1 { font-size: 1.6rem; }
      .summary-strip { flex-direction: column; align-items: flex-start; }
      .summary-strip .total-label { text-align: left; }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ===== ICONS ===== */
    const IconEye = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    );

    const IconWhatsApp = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.818-.728-1.372-1.626-1.535-1.924-.163-.298-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
    );

    /* ===== PRICING ENGINE (Mês a Mês) ===== */
    const BASE_DIARIA = 6000;
    const PISO_OPERACIONAL = 4000;

    const TABELA_MENSAL = {
      1:  { peso: 0.65, diaria: 4000,  nome: 'Baixa (Cheia)',       tag: 'Baixa',   cor: '#60a5fa' },
      2:  { peso: 0.65, diaria: 4000,  nome: 'Baixa (Cheia)',       tag: 'Baixa',   cor: '#60a5fa' },
      3:  { peso: 0.65, diaria: 4000,  nome: 'Baixa (Cheia)',       tag: 'Baixa',   cor: '#60a5fa' },
      4:  { peso: 0.70, diaria: 4200,  nome: 'Baixa (Abril)',       tag: 'Baixa',   cor: '#60a5fa' },
      5:  { peso: 0.75, diaria: 4500,  nome: 'Transição (Maio)',    tag: 'Trans.',   cor: '#a78bfa' },
      6:  { peso: 1.05, diaria: 6300,  nome: 'Média (Junho)',       tag: 'Média',   cor: '#fbbf24' },
      7:  { peso: 1.35, diaria: 8100,  nome: 'Alta (Julho)',        tag: 'Alta',    cor: '#f97316' },
      8:  { peso: 1.50, diaria: 9000,  nome: 'Alta (Agosto)',       tag: 'Alta',    cor: '#f97316' },
      9:  { peso: 2.50, diaria: 15000, nome: 'Pico (Setembro)',     tag: 'Pico',    cor: '#ef4444' },
      10: { peso: 1.35, diaria: 8100,  nome: 'Alta (Outubro)',      tag: 'Alta',    cor: '#f97316' },
      11: { peso: 1.00, diaria: 6000,  nome: 'Equilíbrio (Nov)',    tag: 'Equil.',  cor: '#34d399' },
      12: { peso: 1.00, diaria: 6000,  nome: 'Equilíbrio (Dez)',    tag: 'Equil.',  cor: '#34d399' },
    };

    const NOMES_MESES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function getTemporada(mes) {
      return TABELA_MENSAL[mes] || TABELA_MENSAL[12];
    }

    function calcular({ dataInicio, dataFim, tipoLocacao, incluiCozinha }) {
      if (!dataInicio) return { diaria: 0, total: 0, dias: 0, temporada: '', tag: '', cor: '', valorTabela: 0, taxaCozinha: 0, valorFinal: 0, ready: false };

      const inicio = new Date(dataInicio + 'T12:00:00');
      let fim = new Date((dataFim || dataInicio) + 'T12:00:00');
      if (fim < inicio) fim = inicio;

      const dias = Math.round((fim - inicio) / (1000 * 60 * 60 * 24)) + 1;
      const mes = parseInt(dataInicio.split('-')[1], 10);
      const temp = getTemporada(mes);

      const diariaCheia = temp.diaria;
      const multiplicadorEscopo = tipoLocacao === 'total' ? 1.0 : 0.6;
      const diariaComEscopo = diariaCheia * multiplicadorEscopo;
      const diariaFinal = Math.max(diariaComEscopo, PISO_OPERACIONAL);
      const taxaCozinha = incluiCozinha ? (500 * dias) : 0;
      const valorTabela = diariaFinal * dias;
      const valorFinal = valorTabela + taxaCozinha;

      return {
        diaria: diariaFinal, total: valorFinal, dias, temporada: temp.nome,
        tag: temp.tag, cor: temp.cor, peso: temp.peso, mes,
        valorTabela, taxaCozinha, valorFinal,
        nomeMes: NOMES_MESES[mes] || '',
        formulaEscopo: tipoLocacao !== 'total' ? ' x 0.60 (Área Parcial)' : '',
        ready: true
      };
    }

    function fmt(value) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function fmtDate(ds) {
      if (!ds) return '—';
      const [y, m, d] = ds.split('-');
      return `${d}/${m}/${y}`;
    }

    /* ===== APP COMPONENT ===== */
    function App() {
      const [cliente, setCliente] = useState('');
      const [dataInicio, setDataInicio] = useState('');
      const [dataFim, setDataFim] = useState('');
      const [tipoLocacao, setTipoLocacao] = useState('total');
      const [incluiCozinha, setIncluiCozinha] = useState(false);
      const [detalhesEvento, setDetalhesEvento] = useState('');

      const sim = calcular({ dataInicio, dataFim, tipoLocacao, incluiCozinha });
      const hoje = new Date().toLocaleDateString('pt-BR');

      // WhatsApp Integration
      const WP_NUMBER = "5511988531007"; // Format: Country Code + Area Code + Number

      const handleWhatsAppClick = () => {
        if (!sim.ready || !cliente) {
            alert("Por favor, preencha seu nome e as datas do evento para prosseguir.");
            return;
        }

        const msg = `Olá, João! Me chamo *${cliente}* e gostaria de solicitar a reserva do Balneário Rio Preto para um evento.
        
*Detalhes da Solicitação:*
📅 *Datas:* ${fmtDate(dataInicio)} a ${fmtDate(dataFim)} (${sim.dias} dias)
📍 *Espaço:* ${tipoLocacao === 'total' ? 'Fechamento Total (Todo o balneário)' : 'Parcial (Salão + Palco)'}
🍳 *Cozinha:* ${incluiCozinha ? 'Inclusa (Taxa operacional aplicada)' : 'Não inclusa'}

💰 *Simulação Integral Estimada:* ${fmt(sim.valorFinal)}

✨ *Sobre o meu evento (Análise de Desconto Fomento 2026):*
${detalhesEvento ? detalhesEvento : 'Gostaria de apresentar minha ideia para verificarmos a possibilidade do desconto de fomento cultural para 2026!'}

Aguardando retorno para darmos andamento nesta reserva!`;

        const encodedMsg = encodeURIComponent(msg);
        const waUrl = `https://wa.me/${WP_NUMBER}?text=${encodedMsg}`;
        window.open(waUrl, '_blank');
      };

      const isSubmittable = sim.ready && cliente.trim().length > 0;

      return (
        <React.Fragment>
          <div className="panel-wrapper">
            {/* Header */}
            <div className="panel-header animate-in">
              <img src="https://balnearioriopreto.com.br/images/logo_opt.png" alt="Balneário Rio Preto" />
              <h1>Simulador de Eventos</h1>
              <p>Calcule instantaneamente o valor da locação para o seu evento com base na nossa demanda sazonal, e envie sua proposta direto no nosso WhatsApp.</p>
            </div>

            {/* Form */}
            <div className="glass-card animate-in delay-1">
              <div className="section-title">Configure Seu Evento</div>
              <div className="form-grid">
                <div className="field full-width">
                  <label>Seu Nome ou Nome da Produtora</label>
                  <input type="text" value={cliente} onChange={e => setCliente(e.target.value)} placeholder="Como devemos chamá-lo(a)?" />
                </div>
                <div className="field">
                  <label>Data de Início</label>
                  <input type="date" value={dataInicio} onChange={e => setDataInicio(e.target.value)} />
                </div>
                <div className="field">
                  <label>Data de Término</label>
                  <input type="date" value={dataFim} onChange={e => setDataFim(e.target.value)} />
                </div>
                <div className="field full-width">
                  <label>Área Desejada (Escopo das Locação)</label>
                  <select value={tipoLocacao} onChange={e => setTipoLocacao(e.target.value)}>
                    <option value="total">Fechamento Total (Exclusividade de todo o complexo)</option>
                    <option value="parcial">Locação Parcial (Apenas Salão Coberto e Palco Principal)</option>
                  </select>
                </div>
                <div className="field full-width">
                  <label className="checkbox-row">
                    <input type="checkbox" checked={incluiCozinha} onChange={e => setIncluiCozinha(e.target.checked)} />
                    <span>
                      <strong>Concessão da Cozinha Industrial / Restaurante</strong>
                      <small>Adiciona R$ 500,00 por diária caso necessite utilizar nossos equipamentos e cozinha para alimentação do seu público.</small>
                    </span>
                  </label>
                </div>
                <div className="field full-width">
                  <label>Conte um pouco sobre a sua ideia! (Análise de Desconto)</label>
                  <textarea 
                    id="detalhes-evento"
                    value={detalhesEvento} 
                    onChange={e => setDetalhesEvento(e.target.value)} 
                    placeholder="Ex: Será um evento de música eletrônica voltado para 500 pessoas, com foco em sustentabilidade da natureza local..."
                  ></textarea>
                </div>
              </div>
            </div>

            {/* Summary */}
            <div className="glass-card animate-in delay-2" style={{padding: 0, overflow:'hidden'}}>
              <div className="summary-strip">
                <div>
                  <div className="label-pill" style={sim.cor && sim.ready ? {borderColor: sim.cor + '44', background: sim.cor + '18', color: sim.cor} : {}}>
                    {sim.ready ? `Sazonalidade: ${sim.temporada} (Demanda ${sim.peso}x)` : '📅 Preencha as datas do seu evento'}
                  </div>
                  <div className="calc-detail">
                    {sim.ready
                      ? `${sim.dias} dia${sim.dias > 1 ? 's' : ''} × ${fmt(sim.diaria)} por dia${sim.taxaCozinha > 0 ? ` + Cozinha ${fmt(sim.taxaCozinha)}` : ''}`
                      : 'Aguarda inserção de datas validas para calcular a simulação.'
                    }
                  </div>
                </div>
                <div>
                  <div className="total-label">Estimativa Final</div>
                  <div className="total-value">{sim.ready ? fmt(sim.total) : 'R$ 0,00'}</div>
                </div>
              </div>
            </div>

            {/* Discount Banner */}
            {sim.ready && (
              <div className="discount-banner animate-in delay-2" onClick={() => document.getElementById('detalhes-evento').focus()}>
                <div className="discount-icon">✨</div>
                <div>
                  <h4>Programa de Fomento 2026</h4>
                  <p>O Balneário Rio Preto possui um programa de subsídio exclusivo para produtores de eventos em 2026! <strong>O valor acima reflete nossa base transparente, mas dependendo do perfil do seu evento, podemos aplicar um super desconto de fomento à cultura na negociação.</strong> Clique aqui, detalhe a sua ideia acima e solicite a análise promocional!</p>
                </div>
              </div>
            )}

            {/* Submit Button */}
            <div className="animate-in delay-3">
              <button 
                className="btn-whatsapp" 
                onClick={handleWhatsAppClick}
                disabled={!isSubmittable}
              >
                <IconWhatsApp />
                {isSubmittable ? 'Enviar Solicitação pelo WhatsApp' : 'Preencha Nome e Datas para Enviar'}
              </button>
              <div style={{textAlign: 'center', marginTop: '12px', fontSize: '0.85rem', color: '#94a3b8'}}>
                Ao clicar, você enviará as informações acima para análise comercial da nossa equipe.
              </div>
            </div>

            {/* Document Preview */}
            <div className="preview-wrapper animate-in delay-3" style={{animationDelay: '0.4s', opacity: 0}}>
              <div className="preview-overlay-text">
                <IconEye />
                <span>Pré-visualização do espelho contratual que o aguarda (não editável)</span>
              </div>
              <div className="document-preview">
                <div className="doc-header">
                  <img src="https://balnearioriopreto.com.br/images/logo_opt.png" alt="Logo Balneário" className="doc-logo" />
                  <h1>Resumo dos Termos de Locação</h1>
                  <h2>Balneário Rio Preto LTDA</h2>
                </div>

                <div className="doc-section">
                  <h3>1. Dados Simulados do Evento</h3>
                  <div className="doc-data-grid">
                    <div>
                      <div className="data-label">Cliente / Produtora</div>
                      <div className="data-value">{cliente || 'Nome não preenchido'}</div>
                    </div>
                    <div>
                      <div className="data-label">Período Selecionado</div>
                      <div className="data-value">{sim.ready ? `${fmtDate(dataInicio)} a ${fmtDate(dataFim)} (${sim.dias} dias)` : '—'}</div>
                    </div>
                    <div>
                      <div className="data-label">Modalidade de Acesso</div>
                      <div className="data-value">{tipoLocacao === 'total' ? 'Fechamento Total VIP' : 'Locação Parcial (Salão + Palco)'}</div>
                    </div>
                    <div>
                      <div className="data-label">Uso da Cozinha</div>
                      <div className="data-value">{incluiCozinha ? 'Concessão Inclusa' : 'Acesso Restrito (Não Inclusa)'}</div>
                    </div>
                  </div>
                </div>

                <div className="doc-section">
                  <h3>2. Nossa Política de Transparência</h3>
                  <div className="doc-policy">
                    O modelo de precificação do Balneário Rio Preto é dinâmico e reflete o <strong>custo de oportunidade</strong> para a sazonalidade solicitada, garantindo a sua exclusividade.
                    <br /><br />
                    Para o mês de <strong>{sim.ready ? sim.nomeMes : '[Mês]'}</strong>, aplicamos nosso índice de sazonalidade de <strong>{sim.ready ? sim.peso : 'X'}x</strong> sobre nossa base operacional.
                    <em><br/>Fórmula Matemática:</em> {fmt(BASE_DIARIA)} × {sim.ready ? sim.peso : 'X'}{sim.formulaEscopo} = Diária Real.
                  </div>
                </div>

                <div className="doc-section">
                  <h3>3. Resumo Financeiro</h3>
                  <div>
                    <div className="doc-finance-total" style={{borderBottom: 'none'}}>
                      <span className="fin-label">Valor Projetado ({sim.ready ? `${sim.dias} dias` : '—'}):</span>
                      <span className="fin-value">{sim.ready ? fmt(sim.valorFinal) : '—'}</span>
                    </div>
                  </div>
                </div>

                <div className="doc-section">
                  <h3>4. O que está incluso na sua experiência?</h3>
                  <ul className="doc-list">
                    {tipoLocacao === 'total' ? (
                      <React.Fragment>
                        <li>Uso completo e exclusivo do espaço do Balneário: <strong>Área externa, Piscinas e Quiosques</strong>.</li>
                        <li><strong>Área Coberta, Salão e Palco principal</strong>.</li>
                        <li>Estacionamento VIP para convidados.</li>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <li>Uso exclusivo do <strong>Salão Coberto e Palco principal</strong>.</li>
                        <li>Estacionamento compartilhado.</li>
                        <li><em>*A área de piscinas permanecerá aberta ao público padrão do balneário durante o evento.</em></li>
                      </React.Fragment>
                    )}
                    {incluiCozinha && (
                      <li>Acesso total às instalações da <strong>Cozinha Industrial e Restaurante</strong>, sujeito à vistoria de entrada e saída.</li>
                    )}
                    <li>Local regularizado com Alvará de Funcionamento e Corpo de Bombeiros.</li>
                  </ul>
                  <div style={{marginTop: 16, fontSize: '0.75rem', color: '#6b7280', fontStyle: 'italic'}}>
                    * Notas: É de responsabilidade do produtor prover segurança privada, ambulância UTI, limpeza pós-evento e quaisquer alvarás extras específicos (como ECAD musical). Havendo comercialização de nossos chalés por parte da produção, um repasse de royalties será acordado.
                  </div>
                </div>
              </div>
            </div>
            
          </div>
        </React.Fragment>
      );
    }

    /* Mount */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
